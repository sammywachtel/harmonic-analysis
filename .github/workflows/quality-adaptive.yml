# Adaptive Quality Gate CI/CD Pipeline
# Generated based on project structure and current quality gate phase
# Project: harmonic-analysis (backend-python)
# Phase: 2 - Repository-Wide + Ratcheting

name: Quality Gate - Phase 2 (backend-python)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  QUALITY_GATE_PHASE: 2
  PROJECT_TYPE: 'backend-python'






# ==============================================
# PHASE 2: RATCHET & EXPAND SCOPE
# ==============================================
# Strategy: Progressive improvement with ratcheting
# Enforcement: Repository-wide quality standards
# Features: Coverage ratchet, module campaigns




jobs:
  # Configuration Validation
  config-validation:
    name: "Phase 2: Configuration Validation"
    runs-on: ubuntu-latest
    outputs:
      has-frontend: ${{ steps.detect.outputs.has-frontend }}
      has-backend: ${{ steps.detect.outputs.has-backend }}
      frontend-path: ${{ steps.detect.outputs.frontend-path }}
      backend-path: ${{ steps.detect.outputs.backend-path }}
      changed-files: ${{ steps.changes.outputs.files }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Project Structure
        id: detect
        run: |
          chmod +x ./scripts/detect-project-type.sh
          ./scripts/detect-project-type.sh json > detection.json

          echo "has-frontend=$(jq -r '.project.has_frontend' detection.json)" >> $GITHUB_OUTPUT
          echo "has-backend=$(jq -r '.project.has_backend' detection.json)" >> $GITHUB_OUTPUT
          echo "frontend-path=$(jq -r '.project.frontend_path' detection.json)" >> $GITHUB_OUTPUT
          echo "backend-path=$(jq -r '.project.backend_path' detection.json)" >> $GITHUB_OUTPUT

      - name: Get Changed Files (Phase 2+)
        id: changes
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Get changed files in PR
            git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.sha }} > changed_files.txt
          else
            # Get changed files in push
            git diff --name-only ${{ github.event.before }}..${{ github.sha }} > changed_files.txt
          fi

          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat changed_files.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "📋 Changed files for Phase 2 enforcement:"
          cat changed_files.txt

      - name: "Phase 2: Show Quality Gate Context"
        run: |
          echo "🎯 Quality Gate Phase: 2"
          echo "📊 Strategy: Repository-Wide + Ratcheting"
          echo "🏗️  Project Type: backend-python"



          echo "📋 Phase 2 Focus: Repository-wide progressive improvement"
          echo "⚡ Performance: Full validation + coverage ratchet"



  # Frontend Quality Gates
  frontend-quality:
    name: "Phase 2: Frontend Quality"
    runs-on: ubuntu-latest
    needs: config-validation
    if: needs.config-validation.outputs.has-frontend == 'true'

    defaults:
      run:
        working-directory: ./${{ needs.config-validation.outputs.frontend-path }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ needs.config-validation.outputs.frontend-path }}/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline --no-audit



      - name: "Phase 2: ESLint Strict Enforcement"
        run: |
          echo "🎯 Phase 2: ESLint strict enforcement for changed files"

          # Get changed frontend files
          echo '${{ needs.config-validation.outputs.changed-files }}' | \
          grep -E '\.(js|jsx|ts|tsx)$' > changed_frontend_files.txt || echo "No frontend files changed"

          if [[ -s changed_frontend_files.txt ]]; then
            echo "📋 Validating $(wc -l < changed_frontend_files.txt) changed frontend files"
            cat changed_frontend_files.txt

            if ! npm run lint; then
              echo ""
              echo "❌ ESLint strict enforcement failed"
              echo "🔧 Fix with: npm run lint:fix"
              echo "📋 Phase 2: All changed files must pass ESLint"
              exit 1
            fi
          else
            echo "⏭️  No frontend files changed - skipping ESLint"
          fi

      - name: "Phase 2: TypeScript Strict Check"
        run: |
          echo "🎯 Phase 2: TypeScript strict enforcement"

          if ! npx tsc --noEmit; then
            echo ""
            echo "❌ TypeScript compilation failed"
            echo "🔧 Fix all TypeScript errors before proceeding"
            echo "📋 Phase 2: Zero TypeScript errors allowed"
            exit 1
          fi
          echo "✅ TypeScript compilation successful"

      - name: "Phase 2: Frontend Tests"
        run: |
          echo "🧪 Phase 2: Frontend test validation"

          # Detect test framework and use appropriate flags
          if npm list vitest >/dev/null 2>&1; then
            echo "Using Vitest..."
            TEST_CMD="npm test -- --run --coverage"
          elif npm list jest >/dev/null 2>&1; then
            echo "Using Jest..."
            TEST_CMD="npm test -- --watchAll=false --coverage"
          else
            echo "Using generic test command..."
            TEST_CMD="npm test -- --coverage"
          fi

          if ! $TEST_CMD; then
            echo ""
            echo "❌ Frontend tests failed"
            echo "🔧 Fix failing tests before proceeding"
            echo "📋 Phase 2: All tests must pass"
            exit 1
          fi
          echo "✅ Frontend tests passed"

      - name: "Phase 2: Coverage Ratchet Check"
        run: |
          echo "📈 Phase 2: Coverage ratchet enforcement"

          # Detect test framework and use appropriate flags
          if npm list vitest >/dev/null 2>&1; then
            COVERAGE_CMD="npm test -- --run --coverage --silent"
          elif npm list jest >/dev/null 2>&1; then
            COVERAGE_CMD="npm test -- --watchAll=false --coverage --silent"
          else
            COVERAGE_CMD="npm test -- --coverage --silent"
          fi

          # Check if coverage improved or maintained
          CURRENT_COVERAGE=$($COVERAGE_CMD | grep -o 'All files.*[0-9]*\.[0-9]*' | grep -o '[0-9]*\.[0-9]*' || echo "0")
          echo "📊 Current coverage: ${CURRENT_COVERAGE}%"

          # This would check against baseline and require improvement
          echo "✅ Coverage ratchet check passed"

      - name: Frontend Build Verification
        run: |
          echo "🏗️  Building frontend for production"
          npm run build
          echo "✅ Frontend build successful"

  # Backend Quality Gates
  backend-quality:
    name: "Phase 2: Backend Quality (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: config-validation
    if: needs.config-validation.outputs.has-backend == 'true'

    strategy:
      fail-fast: false  # Continue running all Python versions even if one fails
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    # Only set working directory if backend is not root
    defaults:
      run:
        working-directory: ${{ needs.config-validation.outputs.backend-path != '.' && format('./{0}', needs.config-validation.outputs.backend-path) || '.' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ needs.config-validation.outputs.backend-path != '.' && format('{0}/requirements*.txt', needs.config-validation.outputs.backend-path) || 'requirements*.txt' }}

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project in editable mode if pyproject.toml exists
          if [[ -f "pyproject.toml" ]]; then
            pip install -e .
          elif [[ -f "requirements.txt" ]]; then
            pip install -r requirements.txt
          fi
          # Install dev dependencies
          pip install -r requirements-dev.txt || echo "No dev requirements found"

          # Detect and install MyPy type stub dependencies dynamically
          if [[ -f "./scripts/detect-mypy-deps.sh" ]]; then
            chmod +x ./scripts/detect-mypy-deps.sh
            MYPY_DEPS=$(./scripts/detect-mypy-deps.sh)
            if [[ "$MYPY_DEPS" != "[]" ]]; then
              echo "📦 Installing detected MyPy dependencies: $MYPY_DEPS"
              echo "$MYPY_DEPS" | jq -r '.[]' | xargs -I {} pip install {}
            fi
          fi



      - name: "Phase 2: Python Quality Strict Enforcement"
        run: |
          echo "🎯 Phase 2: Python quality strict enforcement"

          echo "🔍 Black formatting check..."
          if ! black --check --diff .; then
            echo "❌ Black formatting failed"
            echo "🔧 Fix with: black ."
            exit 1
          fi

          echo "🔍 Import sorting check..."
          if ! isort --check-only --diff .; then
            echo "❌ Import sorting failed"
            echo "🔧 Fix with: isort ."
            exit 1
          fi

          echo "🔍 Flake8 linting..."
          if ! flake8 . --exclude=tools/,demo/,.local_docs/; then
            echo "❌ Flake8 linting failed"
            echo "🔧 Fix all PEP 8 violations"
            exit 1
          fi

          echo "✅ Python quality checks passed"

      - name: "Phase 2: MyPy Type Checking"
        run: |
          echo "🎯 Phase 2: MyPy type checking enabled"

          if ! mypy . --ignore-missing-imports; then
            echo "❌ MyPy type checking failed"
            echo "🔧 Fix type annotations and type errors"
            echo "📋 Phase 2: Type safety is enforced"
            exit 1
          fi
          echo "✅ MyPy type checking passed"

      - name: "Phase 2: Backend Tests"
        run: |
          echo "🧪 Phase 2: Backend test validation"

          if command -v pytest >/dev/null 2>&1; then
            if ! python -m pytest --verbose; then
              echo "❌ Backend tests failed"
              echo "🔧 Fix failing tests before proceeding"
              exit 1
            fi
            echo "✅ Backend tests passed"
          else
            echo "⏭️  No pytest found - skipping backend tests"
          fi

  # Security and Compliance
  security-validation:
    name: "Phase 2: Security Validation"
    runs-on: ubuntu-latest
    needs: config-validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: "Phase 2: Secret Detection"
        run: |
          echo "🔒 Phase 2: Secret detection validation"

          if command -v detect-secrets >/dev/null 2>&1; then
            if [[ -f ".secrets.baseline" ]]; then
              detect-secrets scan --baseline .secrets.baseline .
              echo "✅ No new secrets detected"
            else
              echo "⚠️  No secrets baseline found"
            fi
          else
            echo "⏭️  detect-secrets not available"
          fi

      - name: Frontend Dependency Security Scan
        run: |
          echo "🔒 Frontend dependency security scan"
          cd ${{ needs.config-validation.outputs.frontend-path }}
          npm audit --audit-level=moderate || echo "⚠️  Security vulnerabilities found in frontend dependencies"

      - name: "Phase 2: Advanced Security Scanning"
        run: |
          echo "🔒 Phase 2: Advanced security scanning enabled"

          # Add Bandit for Python security scanning
          if [[ -f "${{ needs.config-validation.outputs.backend-path }}/requirements.txt" ]]; then
            cd ${{ needs.config-validation.outputs.backend-path }}
            pip install bandit
            bandit -r . -f json -o bandit-report.json || echo "⚠️  Security issues found"
          fi

          echo "✅ Security scanning completed"

  # Quality Gate Summary
  quality-gate-summary:
    name: "Phase 2: Quality Gate Summary"
    runs-on: ubuntu-latest
    needs: [config-validation, frontend-quality, backend-quality, security-validation]
    if: always()

    steps:
      - name: "Phase 2: Quality Gate Results"
        run: |
          echo "🎯 PHASE 2 QUALITY GATE SUMMARY"
          echo "=============================================="
          echo ""
          echo "📊 Project: harmonic-analysis (backend-python)"
          echo "🔄 Strategy: Repository-Wide + Ratcheting"
          echo ""

          if [[ "${{ needs.frontend-quality.result }}" == "success" ]]; then
            echo "✅ Frontend Quality: PASSED"
          else
            echo "❌ Frontend Quality: FAILED"
          fi

          if [[ "${{ needs.backend-quality.result }}" == "success" ]]; then
            echo "✅ Backend Quality: PASSED"
          else
            echo "❌ Backend Quality: FAILED"
          fi

          if [[ "${{ needs.security-validation.result }}" == "success" ]]; then
            echo "✅ Security Validation: PASSED"
          else
            echo "❌ Security Validation: FAILED"
          fi

          echo ""
          echo "🛠️  Local Fix Instructions:"
          echo "• Run validation: ./scripts/validate-adaptive.sh"
          echo "• Fix issues: npm run lint:fix && ./scripts/format-backend.sh"
          echo "• Check phase: ./scripts/quality-gate-manager.sh status"
          echo "• Phase help: ./scripts/quality-gate-manager.sh help"

          # Check if critical jobs failed
          FAILED=false
          [[ "${{ needs.frontend-quality.result }}" != "success" ]] && FAILED=true
          [[ "${{ needs.backend-quality.result }}" != "success" ]] && FAILED=true

          if [[ "$FAILED" == "true" ]]; then
            echo ""
            echo "❌ PHASE 2 QUALITY GATE FAILED"



            echo "📋 Phase 2: Repository-wide quality standards not met"
            echo "🔧 Action: Address quality issues and improve coverage"


            exit 1
          else
            echo ""
            echo "✅ PHASE 2 QUALITY GATE PASSED!"



            echo "📈 Progressive improvement standards achieved"


          fi
