# Adaptive Pre-commit Configuration
# Generated based on detected project structure

repos:
  # Universal hooks (always enabled)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-yaml
        # quality-adaptive.yml is a Mustache template, not raw YAML — rendered before deploy
        exclude: '^\.github/workflows/quality-adaptive\.yml$'
      - id: check-json
        # tsconfig*.json files are JSONC (JSON with comments) by Microsoft
        # convention; the strict JSON parser chokes on them.
        exclude: '^(.*/)?tsconfig.*\.json$'

  # Frontend hooks (TypeScript/JavaScript). Frontend lives at demo/frontend/
  # in this repo, NOT at a top-level frontend/ — earlier versions of this
  # config silently no-op'd because the files: regex never matched anything.
  # If you change the frontend path, update both `entry:` and `files:`.
  - repo: local
    hooks:
      - id: eslint-check
        name: ESLint Check
        entry: bash -c 'cd demo/frontend && npm run lint'
        language: system
        files: '^demo/frontend/.*\.(js|jsx|ts|tsx)$'
        pass_filenames: false

      - id: typescript-check
        name: TypeScript Check
        entry: bash -c 'cd demo/frontend && npx tsc -b --noEmit'
        language: system
        files: '^demo/frontend/.*\.(ts|tsx)$'
        pass_filenames: false

  # Python hooks
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]
        exclude: '^(tools/|demo/|\.local_docs/)'

  # MyPy type checking (auto-configured based on requirements)
  # Note: Enabled by default to match CI behavior
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - httpx
          - numpy
          - pytest
          - scikit-learn
          - scipy
          - types-jsonschema
        files: '^(src|backend|app)/.*\.py$'

  # Security hooks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # CI workflow consistency — runs whenever a workflow YAML or a script
  # under scripts/ changes. Catches references to deleted scripts before
  # they hit CI (the v0.3.1-beta.3 release shipped with one such orphan
  # because pre-commit had no awareness of workflow contents).
  - repo: local
    hooks:
      - id: check-workflow-refs
        name: Workflow script references
        entry: bash scripts/check-workflow-refs.sh
        language: system
        files: '^(\.github/workflows/.*\.ya?ml|scripts/.*\.(sh|py))$'
        pass_filenames: false
